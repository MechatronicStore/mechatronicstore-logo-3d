name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      # svglib pulls in pycairo, which builds against the system cairo, and
      # rsvg-convert is the renderer svg_to_png.py prefers. Neither ships with
      # the runner image, so the install step fails without these.
      - name: Install native SVG libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev pkg-config librsvg2-bin

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      # The suite deliberately avoids Blender: every test covers the pure Python
      # layers (3mf reading, color grouping, 3mf writing, framing math), so CI
      # stays fast and needs no GUI runtime.
      - name: Run tests
        run: uv run pytest -q
